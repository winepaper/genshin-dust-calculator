name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - run: python verify.py
      - run: python tests/gui_check.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./build.ps1
        shell: pwsh
      - run: python tools/frozen_check.py dist/GenshinDustCalculator.exe
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/package_release.py dist/GenshinDustCalculator.exe
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = python -c "import engine; print(engine.VERSION)"
          $taskTag = "v$taskVersion"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $taskTag) {
            throw 'Release tag and engine.VERSION differ'
          }
          gh release view $taskTag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $taskTag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "启圣之尘收益计算器 $taskVersion" --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $taskTag "dist/GenshinDustCalculator-$taskVersion-win64.exe" "dist/GenshinDustCalculator-$taskVersion-win64.zip" "dist/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
