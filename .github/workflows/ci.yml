name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - run: python verify.py
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - run: python verify.py
      - run: python tests/gui_check.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./build.ps1
        shell: pwsh
      - run: python tools/frozen_check.py dist/GenshinDustCalculator.exe
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe-and-verification
          path: |
            dist/GenshinDustCalculator.exe
            artifacts/
          retention-days: 14
